name: Desktop & Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Build Desktop GUI installers ──────────────────────────────────────────
  # Each OS runner builds only the formats supported by its platform
  # (jpackage cannot cross-compile).
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: "packageDeb packageLinuxTarGz packageAppImage"
            artifacts: |
              composeApp/build/compose/binaries/main/deb/*.deb
              composeApp/build/compose/binaries/main/tar/*.tar.gz
              composeApp/build/compose/binaries/main/appimage/output/*.AppImage
            label: linux

          - os: macos-latest
            tasks: "packageDmg"
            artifacts: "composeApp/build/compose/binaries/main/dmg/*.dmg"
            label: macos

          - os: windows-latest
            tasks: "packageMsi packageInnoSetup"
            artifacts: |
              composeApp/build/compose/binaries/main/msi/*.msi
              packaging/windows/Output/*.exe
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y
        shell: bash

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest

      - name: Build desktop installers
        run: |
          for task in ${{ matrix.tasks }}; do
            ./gradlew :composeApp:$task
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melo-desktop-${{ matrix.label }}
          path: ${{ matrix.artifacts }}

  # ─── Build Android APK ─────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: melo-android
          path: composeApp/build/outputs/apk/release/*.apk

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [ build-desktop, build-android ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
