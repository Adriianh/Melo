name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: distUnix
            artifact: "tui/build/dist/melo-*-linux.tar.gz"
            label: linux
          - os: macos-latest
            task: distUnix
            artifact: "tui/build/dist/melo-*-macos.tar.gz"
            label: macos
          - os: windows-latest
            task: distWindows
            artifact: "tui/build/dist/melo-*-windows.zip"
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set JAVA_HOME for Gradle (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_25_X64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:JAVA_HOME_25_X64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Run tests
        run: ./gradlew :tui:test

      - name: Build distribution
        run: ./gradlew :tui:${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-${{ matrix.label }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: dist/

      - name: Prepare nightly assets
        if: startsWith(github.ref, 'refs/heads/master')
        run: |
          mkdir -p nightly_dist
          win_zip=$(find dist/ -name "*windows.zip" | head -n 1)
          if [ -n "$win_zip" ]; then cp "$win_zip" nightly_dist/melo-nightly-windows.zip; fi
          linux_tar=$(find dist/ -name "*linux.tar.gz" | head -n 1)
          if [ -n "$linux_tar" ]; then cp "$linux_tar" nightly_dist/melo-nightly-linux.tar.gz; fi
          macos_tar=$(find dist/ -name "*macos.tar.gz" | head -n 1)
          if [ -n "$macos_tar" ]; then cp "$macos_tar" nightly_dist/melo-nightly-macos.tar.gz; fi
          ls -la nightly_dist/

      - name: Publish Nightly Release
        if: startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Melo Development Build (Nightly)"
          body: |
            Automated development build from commit ${{ github.sha }}.
            
            Install on Windows:
            ```powershell
            $env:MELO_VERSION="nightly"; irm https://raw.githubusercontent.com/Adriianh/Melo/master/scripts/install.ps1 | iex
            ```
            
            Install on Linux/macOS:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Adriianh/Melo/master/scripts/install.sh | bash -s -- --nightly
            ```
          prerelease: true
          make_latest: false
          files: nightly_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Official Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
