name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize publishes so concurrent runs never race updating the same
  # release/tag (nightly on master, official on v*).
  group: release
  cancel-in-progress: false

jobs:
  # ─── Resolve build version ────────────────────────────────────────────────
  #   - tag v*  -> the tag version (official release)
  #   - master  -> stable base + "-nightly.<UTC date>" (distinct from stable)
  # The stable base is read from gradle.properties so it is never duplicated.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      melo_version: ${{ steps.version.outputs.melo_version }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            melo_version="${GITHUB_REF#refs/tags/v}"
          else
            base=$(sed -nE 's/^melo\.version=(.*)$/\1/p' gradle.properties | tail -n 1)
            melo_version="${base}-nightly.$(date -u +%Y%m%d.%H%M)"
          fi
          echo "melo_version=${melo_version}" >> "$GITHUB_OUTPUT"
          echo "Melo version: ${melo_version}"

  # ─── Build TUI CLI (GraalVM native) ───────────────────────────────────────
  build-tui:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: distUnix
            artifact: "tui/build/dist/melo-*-linux.tar.gz"
            label: linux
          - os: macos-latest
            task: distUnix
            artifact: "tui/build/dist/melo-*-macos.tar.gz"
            label: macos
          - os: windows-latest
            task: distWindows
            artifact: "tui/build/dist/melo-*-windows.zip"
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set JAVA_HOME for Gradle (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_25_X64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:JAVA_HOME_25_X64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build distribution
        run: ./gradlew :tui:${{ matrix.task }} -Pmelo.version=${{ needs.resolve-version.outputs.melo_version }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-${{ matrix.label }}
          path: ${{ matrix.artifact }}

  # ─── Build Desktop GUI installers ─────────────────────────────────────────
  # Each OS runner builds only the formats supported by its platform
  # (jpackage cannot cross-compile).
  build-desktop:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: "packageDeb packageLinuxTarGz packageAppImage"
            artifacts: |
              composeApp/build/compose/binaries/main/deb/*.deb
              composeApp/build/compose/binaries/main/tar/*.tar.gz
              composeApp/build/compose/binaries/main/appimage/output/*.AppImage
            label: linux

          - os: macos-latest
            tasks: "packageDmg"
            artifacts: "composeApp/build/compose/binaries/main/dmg/*.dmg"
            label: macos

          - os: windows-latest
            tasks: "packageMsi packageInnoSetup"
            artifacts: |
              composeApp/build/compose/binaries/main/msi/*.msi
              packaging/windows/Output/*.exe
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest

      - name: Build desktop installers
        run: |
          for task in ${{ matrix.tasks }}; do
            ./gradlew :composeApp:$task -Pmelo.version=${{ needs.resolve-version.outputs.melo_version }}
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-desktop-${{ matrix.label }}
          path: ${{ matrix.artifacts }}

  # ─── Build Android APK ────────────────────────────────────────────────────
  # Signed with the repository keystore (KEYSTORE_BASE64 secret). Every build
  # must share a single signer: with a per-run keystore Android rejects the
  # in-app update with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Without them the APK would be signed with a throwaway key and in-app updates would fail."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/melo-release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/melo-release.keystore" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease -Pmelo.version=${{ needs.resolve-version.outputs.melo_version }}

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-android
          path: composeApp/build/outputs/apk/release/*.apk

  # ─── Create GitHub Release ────────────────────────────────────────────────
  #   - push to master  -> update the "nightly" development prerelease
  #   - tag v*           -> publish the official release
  release:
    needs: [ build-tui, build-desktop, build-android ]
    runs-on: ubuntu-latest

    steps:
      # Full history and tags are required to compute the changelog ranges
      # (previous nightly target and latest stable tag) with git.
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: dist/

      - name: Prepare nightly assets
        if: startsWith(github.ref, 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Derive the app version from the built TUI artifact name. Stable versions
          # are just "2.1.5"; nightly builds carry a "-nightly.<date>" suffix.
          tui_linux=$(find dist -name 'melo-*-linux.tar.gz' | head -n 1)
          app_version=$(basename "$tui_linux" | sed -E 's/^melo-(.+)-linux\.tar\.gz$/\1/')
          if [ -z "$app_version" ]; then
            echo "::error::could not derive app version from TUI artifact"
            exit 1
          fi
          # Numeric base used by jpackage artifacts (MSI/DEB/DMG), e.g. 2.1.5.
          app_version_base="${app_version%%-*}"
          echo "App version detected: $app_version"

          mkdir -p nightly_dist
          find dist -type f | while read -r f; do
            base=$(basename "$f")
            # Script-compatible names (install.sh / install.ps1) must stay the same.
            case "$base" in
              melo-${app_version}-linux.tar.gz)  new="melo-nightly-linux.tar.gz"  ;;
              melo-${app_version}-macos.tar.gz)  new="melo-nightly-macos.tar.gz"  ;;
              melo-${app_version}-windows.zip)   new="melo-nightly-windows.zip"   ;;
              composeApp-release.apk)            new="melo-nightly.apk"           ;;
              *)  new=${base//${app_version}/nightly}
                  new=${new//${app_version_base}/nightly}
                  ;;
            esac
            cp "$f" "nightly_dist/$new"
          done

          # ── Changelog rendering ──────────────────────────────────────────
          # Group Conventional Commit subjects into changelog sections.
          # Subjects that do not parse fall through to "Other" instead of
          # being dropped, so nothing silently disappears from the notes.
          render_changes() {
            local range="$1"
            local tmp
            tmp=$(mktemp)
            git log --no-merges --pretty=format:'%s' "$range" > "$tmp" 2>/dev/null || true

            if [ ! -s "$tmp" ]; then
              rm -f "$tmp"
              return 1
            fi

            local new="" fixed="" improved="" other=""
            local subject type desc pr entry
            # Regexes live in variables: unquoted parentheses inside a
            # [[ =~ ]] expression are a syntax error in bash.
            local re_commit='^([a-z]+)(\([^)]*\))?(!)?:[[:space:]]*(.+)$'
            local re_pr='^(.*)[[:space:]]\(#([0-9]+)\)$'
            while IFS= read -r subject; do
              [ -n "$subject" ] || continue
              type=""
              desc="$subject"
              if [[ "$subject" =~ $re_commit ]]; then
                type="${BASH_REMATCH[1]}"
                desc="${BASH_REMATCH[4]}"
              fi
              # A trailing "(#123)" becomes a link to the pull request.
              pr=""
              if [[ "$desc" =~ $re_pr ]]; then
                desc="${BASH_REMATCH[1]}"
                pr="${BASH_REMATCH[2]}"
              fi
              entry="- ${desc}"
              if [ -n "$pr" ]; then
                entry="${entry} ([#${pr}](https://github.com/${GITHUB_REPOSITORY}/pull/${pr}))"
              fi
              case "$type" in
                feat)        new="${new}${entry}"$'\n' ;;
                fix|revert)  fixed="${fixed}${entry}"$'\n' ;;
                perf|style)  improved="${improved}${entry}"$'\n' ;;
                *)           other="${other}${entry}"$'\n' ;;
              esac
            done < "$tmp"
            rm -f "$tmp"

            local emitted=0
            for section in New Fixed Improved Other; do
              local body=""
              case "$section" in
                New)      body="$new" ;;
                Fixed)    body="$fixed" ;;
                Improved) body="$improved" ;;
                Other)    body="$other" ;;
              esac
              [ -n "$body" ] || continue
              echo "### $section"
              echo
              printf '%s' "$body"
              echo
              emitted=1
            done

            [ "$emitted" -eq 1 ] || return 1
            return 0
          }

          # ── Resolve changelog ranges ─────────────────────────────────────
          # Previous nightly: the commit the "nightly" release pointed at before
          # this run overwrites it. The ancestry check means a force-push or a
          # missing release yields no section instead of a bogus diff.
          prev_nightly=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" \
            --jq .target_commitish 2>/dev/null || true)
          nightly_range=""
          if [ -n "$prev_nightly" ] \
             && git rev-parse --verify --quiet "${prev_nightly}^{commit}" >/dev/null \
             && git merge-base --is-ancestor "$prev_nightly" HEAD 2>/dev/null \
             && [ "$(git rev-list --count "${prev_nightly}..HEAD")" -gt 0 ]; then
            nightly_range="${prev_nightly}..HEAD"
            echo "Nightly changelog range: $nightly_range"
          fi

          # Latest stable release tag (v*). releases/latest already skips
          # prereleases, so the nightly tag is never picked up here.
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$latest_tag" ]; then
            latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          fi
          stable_range=""
          if [ -n "$latest_tag" ] \
             && git rev-parse --verify --quiet "${latest_tag}^{commit}" >/dev/null \
             && git merge-base --is-ancestor "$latest_tag" HEAD 2>/dev/null \
             && [ "$(git rev-list --count "${latest_tag}..HEAD")" -gt 0 ]; then
            stable_range="${latest_tag}..HEAD"
            echo "Stable changelog range: $stable_range"
          fi

          # Nightly release body: build info + changelogs + CLI + assets table.
          {
            echo "## Build information"
            echo
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| **Version** | \`$app_version\` |"
            echo "| **Built from** | [\`${GITHUB_SHA:0:7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) on \`${GITHUB_REF_NAME}\` |"
            echo "| **Built at** | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            echo "> [!WARNING]"
            echo "> This is an automated development build, not an official release."
            echo "> It ships on every push to \`master\` and may be unstable or broken."
            echo "> Use the latest stable release if you need something reliable."
            echo
            echo "## Changes since the last nightly"
            echo
            if [ -n "$nightly_range" ] && render_changes "$nightly_range"; then
              :
            else
              echo "_No changes since the previous nightly build._"
            fi
            echo
            if [ -n "$latest_tag" ]; then
              echo "## Changes since the last stable release (\`$latest_tag\`)"
            else
              echo "## Changes since the last stable release"
            fi
            echo
            if [ -n "$stable_range" ] && render_changes "$stable_range"; then
              :
            else
              echo "_No changes since the last stable release._"
            fi
            echo
            echo "---"
            echo
            echo "### CLI (TUI)"
            echo
            echo "Install on Windows:"
            echo '```powershell'
            echo '$env:MELO_VERSION="nightly"; irm https://raw.githubusercontent.com/Adriianh/Melo/master/scripts/install.ps1 | iex'
            echo '```'
            echo
            echo "Install on Linux/macOS:"
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/Adriianh/Melo/master/scripts/install.sh | bash -s -- --nightly'
            echo '```'
            echo
            echo "---"
            echo
            echo "### Downloads & Assets"
            echo
            echo "| Platform | Package / Type | File |"
            echo "| :--- | :--- | :--- |"
            for f in nightly_dist/*; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              url="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/$name"
              platform="Other"
              type="Binary"
              # Order matters: the most specific patterns must come first, or
              # "melo-nightly-macos.tar.gz" is swallowed by the generic
              # "*.tar.gz" branch and mislabelled as a Linux tarball.
              case "$name" in
                *android*|*.apk)
                  platform="🤖 Android"
                  type="APK"
                  ;;
                *windows.zip)
                  platform="🪟 Windows"
                  type="CLI (TUI)"
                  ;;
                *.exe)
                  platform="🪟 Windows"
                  type="Setup Installer"
                  ;;
                *.msi)
                  platform="🪟 Windows"
                  type="MSI Package"
                  ;;
                *macos.tar.gz)
                  platform="🍎 macOS"
                  type="CLI (TUI)"
                  ;;
                *.dmg)
                  platform="🍎 macOS"
                  type="DMG Installer"
                  ;;
                *linux.tar.gz)
                  platform="🐧 Linux"
                  type="CLI (TUI)"
                  ;;
                *.deb)
                  platform="🐧 Linux"
                  type="DEB Package"
                  ;;
                *.AppImage)
                  platform="🐧 Linux"
                  type="AppImage"
                  ;;
                *.tar.gz)
                  platform="🐧 Linux"
                  type="Portable Tarball"
                  ;;
              esac
              echo "| $platform | $type | [$name]($url) |"
            done
          } > nightly_body.md

          ls -la nightly_dist/

      - name: Publish Nightly Release
        if: startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Melo Development Build (Nightly)"
          body_path: nightly_body.md
          prerelease: true
          make_latest: false
          files: nightly_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Official Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}