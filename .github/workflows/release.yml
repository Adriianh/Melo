name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize publishes so concurrent runs never race updating the same
  # release/tag (nightly on master, official on v*).
  group: release
  cancel-in-progress: false

jobs:
  # ─── Build TUI CLI (GraalVM native) ───────────────────────────────────────
  build-tui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: distUnix
            artifact: "tui/build/dist/melo-*-linux.tar.gz"
            label: linux
          - os: macos-latest
            task: distUnix
            artifact: "tui/build/dist/melo-*-macos.tar.gz"
            label: macos
          - os: windows-latest
            task: distWindows
            artifact: "tui/build/dist/melo-*-windows.zip"
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDKs
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set JAVA_HOME for Gradle (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME_25_X64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:JAVA_HOME_25_X64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Run tests
        run: ./gradlew :tui:test

      - name: Build distribution
        run: ./gradlew :tui:${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-${{ matrix.label }}
          path: ${{ matrix.artifact }}

  # ─── Build Desktop GUI installers ─────────────────────────────────────────
  # Each OS runner builds only the formats supported by its platform
  # (jpackage cannot cross-compile).
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: "packageDeb packageLinuxTarGz packageAppImage"
            artifacts: |
              composeApp/build/compose/binaries/main/deb/*.deb
              composeApp/build/compose/binaries/main/tar/*.tar.gz
              composeApp/build/compose/binaries/main/appimage/output/*.AppImage
            label: linux

          - os: macos-latest
            tasks: "packageDmg"
            artifacts: "composeApp/build/compose/binaries/main/dmg/*.dmg"
            label: macos

          - os: windows-latest
            tasks: "packageMsi packageInnoSetup"
            artifacts: |
              composeApp/build/compose/binaries/main/msi/*.msi
              packaging/windows/Output/*.exe
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y
        shell: bash

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest

      - name: Build desktop installers
        run: |
          for task in ${{ matrix.tasks }}; do
            ./gradlew :composeApp:$task
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-desktop-${{ matrix.label }}
          path: ${{ matrix.artifacts }}

  # ─── Build Android APK ────────────────────────────────────────────────────
  # No secrets needed: the release signing config falls back to the debug
  # keystore, and the runner uses the preinstalled Android SDK.
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Create debug keystore if not present
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-android
          path: composeApp/build/outputs/apk/release/*.apk

  # ─── Create GitHub Release ────────────────────────────────────────────────
  #   - push to master  -> update the "nightly" development prerelease
  #   - tag v*           -> publish the official release
  release:
    needs: [ build-tui, build-desktop, build-android ]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.0
        with:
          path: dist/

      - name: Prepare nightly assets
        if: startsWith(github.ref, 'refs/heads/master')
        run: |
          set -euo pipefail

          # Derive the app version from the built TUI artifact name.
          tui_linux=$(find dist -name 'melo-*-linux.tar.gz' | head -n 1)
          app_version=$(basename "$tui_linux" | sed -E 's/^melo-([0-9.]+)-linux\.tar\.gz$/\1/')
          if [ -z "$app_version" ]; then
            echo "::error::could not derive app version from TUI artifact"
            exit 1
          fi
          echo "App version detected: $app_version"

          mkdir -p nightly_dist
          find dist -type f | while read -r f; do
            base=$(basename "$f")
            # Script-compatible names (install.sh / install.ps1) must stay the same.
            case "$base" in
              melo-${app_version}-linux.tar.gz)  new="melo-nightly-linux.tar.gz"  ;;
              melo-${app_version}-macos.tar.gz)  new="melo-nightly-macos.tar.gz"  ;;
              melo-${app_version}-windows.zip)   new="melo-nightly-windows.zip"   ;;
              composeApp-release.apk)            new="melo-nightly.apk"           ;;
              *)                                 new=${base//${app_version}/nightly} ;;
            esac
            cp "$f" "nightly_dist/$new"
          done

          # Nightly release body: static header + dynamic asset list.
          {
            echo "Automated development build from commit \`$GITHUB_SHA\`."
            echo
            echo "> Nightly builds ship every push to \`master\`. They are development"
            echo "> snapshots, not official releases."
            echo
            echo "### CLI (TUI)"
            echo
            echo "Install on Windows:"
            echo '```powershell'
            echo '$env:MELO_VERSION="nightly"; irm https://raw.githubusercontent.com/Adriianh/Melo/master/scripts/install.ps1 | iex'
            echo '```'
            echo
            echo "Install on Linux/macOS:"
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/Adriianh/Melo/master/scripts/install.sh | bash -s -- --nightly'
            echo '```'
            echo
            echo "### Assets"
            echo
            for f in nightly_dist/*; do
              name=$(basename "$f")
              echo "- [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/$name)"
            done
          } > nightly_body.md

          ls -la nightly_dist/

      - name: Publish Nightly Release
        if: startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Melo Development Build (Nightly)"
          body_path: nightly_body.md
          prerelease: true
          make_latest: false
          files: nightly_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Official Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}