name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew :data:jvmTest :tui:test --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-reports-${{ matrix.label }}
          path: |
            **/build/reports/tests/
          retention-days: 7

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run quality gates (detekt + ktlint)
        run: ./gradlew detektCheck ktlintCheck --no-daemon --continue

      - name: Check Compose Resources i18n key parity
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys

          base = Path("composeApp/src/commonMain/composeResources")
          es_root = ET.parse(base / "values/strings.xml").getroot()
          en_root = ET.parse(base / "values-en/strings.xml").getroot()

          es_keys = {(e.tag, e.attrib["name"]) for e in es_root if "name" in e.attrib}
          en_keys = {(e.tag, e.attrib["name"]) for e in en_root if "name" in e.attrib}

          missing_en = sorted(es_keys - en_keys)
          extra_en = sorted(en_keys - es_keys)
          if missing_en or extra_en:
              if missing_en:
                  print("Missing in values-en/strings.xml:", missing_en)
              if extra_en:
                  print("Extra in values-en/strings.xml:", extra_en)
              sys.exit(1)
          print(f"i18n parity OK ({len(es_keys)} keys)")
          EOF

  compose:
    name: Compose (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and test Compose desktop app
        run: ./gradlew :composeApp:jvmTest --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-reports-compose
          path: |
            **/build/reports/tests/
          retention-days: 7

  android:
    name: Android (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Create debug keystore if not present
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --continue

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: melo-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7
